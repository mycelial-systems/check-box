<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Check Box Example</title>
</head>
<body>
    <h1>Check Box</h1>

    <ul>
        <li>
            <check-box name="option1">First option</check-box>
        </li>
        <li>
            <!--
                The `checked` attribute is consumed during render:
                it is forwarded to the inner <input> and removed
                from the <check-box> host element.
            -->
            <check-box name="option2" checked>
                Second option (checked by default)
            </check-box>
        </li>
        <li>
            <check-box name="option3" disabled>
                Disabled option
            </check-box>
        </li>
    </ul>

    <h2>Bare (no inner text)</h2>
    <div style="display:flex; gap:1rem; align-items:center;">
        <check-box name="bare1"></check-box>
        <check-box name="bare2" checked></check-box>
        <check-box name="bare3" disabled></check-box>
        <check-box>With a label, for comparison</check-box>
    </div>

    <script type="module" src="./index.ts"></script>
</body>
</html>
