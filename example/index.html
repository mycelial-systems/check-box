<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Check Box Example</title>
</head>
<body>
    <h1>Check Box</h1>

    <ul>
        <li>
            <check-box name="option1" label="First option"></check-box>
        </li>
        <li>
            <check-box
                name="option2"
                checked
                label="Second option (checked by default)"
            ></check-box>
        </li>
        <li>
            <check-box name="option3" disabled label="Disabled option">
            </check-box>
        </li>
    </ul>

    <h2>Bare (no inner text)</h2>
    <div style="display:flex; gap:1rem; align-items:center;">
        <check-box name="bare1"></check-box>
        <check-box name="bare2" checked></check-box>
        <check-box name="bare3" disabled></check-box>
        <check-box label="With a label, for comparison"></check-box>
    </div>

    <script type="module" src="./index.ts"></script>
</body>
</html>
